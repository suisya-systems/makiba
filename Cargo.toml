[package]
name = "makiba"
version = "0.0.0"
edition = "2024"
rust-version = "1.89"
description = "An organization where the person talks to one secretary, built on herdr-core."
publish = false

# The test agent (M0-4): tests launch it through CARGO_BIN_EXE_makiba-fake-agent. A release ships
# only `makiba` (`cargo build --release --bin makiba`).
[[bin]]
name = "makiba-fake-agent"
path = "tests/common/fake_agent.rs"

[dependencies]
clap = { version = "4.6.8", default-features = false, features = ["std", "derive", "help", "usage", "error-context", "suggestions"] }
httparse = "1.10.1"
libc = "0.2.191"
regex = "1.13.2"
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
signal-hook = "0.4.6"

[dev-dependencies]
tempfile = "3.27.0"

# Dev and test builds (the test profile inherits this) keep line tables, so backtraces still name
# file:line, and drop variable and type debug info: with one binary per test file, full debug info
# filled the disk (docs/design/incidents.md).
[profile.dev]
debug = "line-tables-only"

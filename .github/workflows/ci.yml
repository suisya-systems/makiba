name: CI
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # rustup installs the toolchain of rust-toolchain.toml on the first cargo call.
      - run: cargo test --locked
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python3 -m pip install pytest
      # The development tools' tests, and tests/db/ until M0-5 removes it.
      - run: python3 -m pytest -q tests
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python3 tools/check_language.py
  acceptance:
    # .github/acceptance-check names this job: claude-org-ja's landing gate takes it as the
    # test-first evidence. Rename the job and that file together. See docs/acceptance-check.md.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Install the toolchain of rust-toolchain.toml
        run: rustup toolchain install
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python3 -m pip install pytest
      - name: Declared tests fail at the test commit, pass at head, stay unchanged
        # The checker is taken from the base, so a PR cannot change the rules it is judged by.
        # The PR's own copy is used only while the base has none (the PR that adds it).
        run: |
          base=${{ github.event.pull_request.base.sha }}
          git show "$base:scripts/acceptance-check.sh" > "$RUNNER_TEMP/acceptance-check.sh" 2>/dev/null \
            || cp scripts/acceptance-check.sh "$RUNNER_TEMP/acceptance-check.sh"
          bash "$RUNNER_TEMP/acceptance-check.sh" "$base" "${{ github.event.pull_request.head.sha }}"
